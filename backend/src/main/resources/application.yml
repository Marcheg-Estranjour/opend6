spring:
  application:
    name: opend6
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health, info

opend6:
  dice:
    critical-failure-rule: ANNULER_DE_LIBRE_ET_PLUS_HAUT
  cors:
    allowed-origin: http://localhost:4200